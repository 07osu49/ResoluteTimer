name: Build Resolute Watch APK
on:
  push:
    branches: [main]
    paths: ['watch/**', '.github/workflows/build-watch.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Test and build watch APK
        working-directory: watch
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify watch package and signature
        shell: bash
        run: |
          APK=watch/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          mkdir -p watch-delivery
          cp "$APK" watch-delivery/ResoluteTimer-Watch.apk
          cp watch/INSTALL.md watch-delivery/INSTALL.md
      - uses: actions/upload-artifact@v4
        with:
          name: ResoluteTimer-Watch
          path: watch-delivery/
          retention-days: 90
